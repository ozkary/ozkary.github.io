<!-- Mermaid.js Pure JS Integration with Click-to-Expand Lightbox -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  
  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'loose',
    flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
    sequence: { useMaxWidth: true, showSequenceNumbers: true }
  });

  document.addEventListener('DOMContentLoaded', async () => {
    // Select Kramdown code blocks for Mermaid
    const codeBlocks = document.querySelectorAll('pre code.language-mermaid, div.language-mermaid pre code');
    if (!codeBlocks.length) return;

    // Build the Lightbox Modal in DOM
    const modal = document.createElement('div');
    modal.id = 'mermaid-lightbox-modal';
    modal.className = 'mermaid-lightbox-modal';
    modal.innerHTML = `
      <div class="mermaid-lightbox-backdrop"></div>
      <div class="mermaid-lightbox-container">
        <div class="mermaid-lightbox-toolbar">
          <button type="button" class="mermaid-btn" id="mermaid-zoom-in" title="Zoom In">➕</button>
          <button type="button" class="mermaid-btn" id="mermaid-zoom-out" title="Zoom Out">➖</button>
          <button type="button" class="mermaid-btn" id="mermaid-zoom-reset" title="Reset Zoom">↺</button>
          <button type="button" class="mermaid-btn mermaid-btn-close" id="mermaid-close" title="Close (Esc)">✕</button>
        </div>
        <div class="mermaid-lightbox-content" id="mermaid-lightbox-content"></div>
      </div>
    `;
    document.body.appendChild(modal);

    let currentScale = 1;
    const contentArea = modal.querySelector('#mermaid-lightbox-content');
    const updateScale = () => {
      const svg = contentArea.querySelector('svg');
      if (svg) svg.style.transform = `scale(${currentScale})`;
    };

    modal.querySelector('#mermaid-zoom-in').addEventListener('click', () => {
      currentScale = Math.min(currentScale + 0.25, 4);
      updateScale();
    });
    modal.querySelector('#mermaid-zoom-out').addEventListener('click', () => {
      currentScale = Math.max(currentScale - 0.25, 0.5);
      updateScale();
    });
    modal.querySelector('#mermaid-zoom-reset').addEventListener('click', () => {
      currentScale = 1;
      updateScale();
    });

    const closeModal = () => {
      modal.classList.remove('active');
      contentArea.innerHTML = '';
      currentScale = 1;
      document.body.style.overflow = '';
    };

    modal.querySelector('#mermaid-close').addEventListener('click', closeModal);
    modal.querySelector('.mermaid-lightbox-backdrop').addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    // Replace kramdown code blocks with interactive mermaid containers
    for (const code of codeBlocks) {
      const pre = code.closest('pre');
      const container = pre.closest('.highlighter-rouge') || pre;
      
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid-wrapper';

      const zoomBadge = document.createElement('button');
      zoomBadge.type = 'button';
      zoomBadge.className = 'mermaid-expand-btn';
      zoomBadge.innerHTML = '🔍 Click to Expand';
      zoomBadge.title = 'Open full-resolution diagram in lightbox';

      const chartDiv = document.createElement('div');
      chartDiv.className = 'mermaid';
      chartDiv.textContent = code.textContent;

      wrapper.appendChild(zoomBadge);
      wrapper.appendChild(chartDiv);
      container.parentNode.replaceChild(wrapper, container);

      const openInModal = () => {
        const svg = chartDiv.querySelector('svg');
        if (!svg) return;
        contentArea.innerHTML = svg.outerHTML;
        currentScale = 1;
        updateScale();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      };

      zoomBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        openInModal();
      });
      chartDiv.addEventListener('click', openInModal);
    }

    await mermaid.run();
  });
</script>

<style>

    margin: 2rem 0;

  }

    border: 1px solid #cbd5e1;

    padding: 3px 8px;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mermaid-expand-btn:hover {
    background: #e2e8f0;
    color: #0f172a;
  }
  .mermaid {
    display: flex;

    padding: 0.5rem;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }

  /* Lightbox Modal */
  .mermaid-lightbox-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 99999;
    align-items: center;
    justify-content: center;
  }
  .mermaid-lightbox-modal.active {
    display: flex;
  }
  .mermaid-lightbox-backdrop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;

    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px);
  }
  .mermaid-lightbox-container {
    position: relative;
    z-index: 2;
    width: 94vw;
    height: 90vh;
    background: #ffffff;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  .mermaid-lightbox-toolbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }
  .mermaid-btn {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.875rem;
    cursor: pointer;
    font-weight: 600;
    color: #334155;
    transition: all 0.15s;
  }
  .mermaid-btn:hover {
    background: #f1f5f9;
    color: #0f172a;
  }
  .mermaid-btn-close {
    background: #fee2e2;

    margin-left: 8px;
  }
  .mermaid-btn-close:hover {
    background: #fecaca;
    color: #7f1d1d;
  }
  .mermaid-lightbox-content {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #ffffff;
  }
  .mermaid-lightbox-content svg {
    max-width: none;
    transition: transform 0.2s ease-out;
    transform-origin: center center;
  }
</style>
